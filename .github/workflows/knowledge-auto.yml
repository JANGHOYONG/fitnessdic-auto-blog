name: Auto Publish Knowledge Post (비활성화)
# 다이어트·운동 백과에는 knowledge 카테고리 없음 — 비활성화
# 시니어 건강백과 잔재 파일

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "이 워크플로우는 다이어트 블로그에서 사용하지 않습니다."
        required: true
        default: "no"

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "이 워크플로우는 비활성화 상태입니다."
