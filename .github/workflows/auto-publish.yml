name: Auto Publish (감수 승인 1건)

on:
  # 스케줄 제거 — 발행은 /admin/review 에서 수동 승인으로만 처리
  # 기존 DRAFT 긴급 발행 필요 시 workflow_dispatch 수동 실행
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Publish 1 APPROVED post
        run: node scripts/publisher.js --mode=immediate --limit=1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          PUBLISH_FROM_APPROVED: "true"
