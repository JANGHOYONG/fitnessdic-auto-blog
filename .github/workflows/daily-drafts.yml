name: Daily Drafts (초안 1건 · v3)

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = KST 06:00
  workflow_dispatch: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check REVIEW_REQUIRED queue size
        id: queue_check
        run: |
          QUEUE=$(node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          prisma.post.count({ where: { status: { in: ['REVIEW_REQUIRED', 'APPROVED'] } } })
            .then(n => { process.stdout.write(String(n)); })
            .finally(() => prisma.\$disconnect());
          ")
          echo "queue=$QUEUE" >> $GITHUB_OUTPUT
          echo "감수 대기 큐: ${QUEUE}건"
          if [ "$QUEUE" -ge 7 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "큐 적체 — 초안 생성 중단 (감수를 먼저 진행하세요)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Auto-replenish keywords if low
        if: steps.queue_check.outputs.skip != 'true'
        run: |
          KWCOUNT=$(node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          prisma.keyword.count({ where: { used: false } })
            .then(n => { process.stdout.write(String(n)); })
            .finally(() => prisma.\$disconnect());
          ")
          echo "미사용 키워드: ${KWCOUNT}개"
          if [ "$KWCOUNT" -lt 10 ]; then
            echo "키워드 부족 — 자동 수집 시작"
            node scripts/keyword-collector.js --count=20
          else
            echo "키워드 충분"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Generate 1 draft (v3 · gpt-4o-mini)
        if: steps.queue_check.outputs.skip != 'true'
        run: node scripts/content-generator-v3.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          DAILY_DRAFT_COUNT: "1"
